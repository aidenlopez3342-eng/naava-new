<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NAVAA</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14152B;
        --panel: #1D1E3B;
        --muted: #9296AC;
        --accent: #FF8A3D;
        --text: #F7F5F0;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
      }

      .shell {
        width: min(640px, 90vw);
        background: var(--panel);
        border-radius: 24px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 22px 48px rgba(10, 13, 24, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 3.2rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(255, 138, 61, 0.12);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="badge">Focus mode</div>
      <h1>NAVAA</h1>
      <p>Monitoring active apps and protecting your focus sessions.</p>
    </main>

    <script>
      window.navaaTakeBreak = function () {
        console.log('NAVAA: break requested from the app shell');
      };
    </script>
  </body>
</html>
