name: Build NAVAA Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify source files
        shell: pwsh
        run: |
          if (!(Test-Path "NAVAA_calendar_updated.html")) { throw "Root HTML file missing" }
          if (!(Test-Path "navaa-desktop/main.js")) { throw "main.js missing" }
          Write-Host "Source files found."

      - name: Copy NAVAA interface
        run: node -e "require('fs').copyFileSync('NAVAA_calendar_updated.html', 'navaa-desktop/index.html')"

      - name: Check JavaScript syntax
        working-directory: navaa-desktop
        run: node --check main.js

      - name: Install dependencies
        working-directory: navaa-desktop
        run: npm install

      - name: Build Windows installer
        working-directory: navaa-desktop
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NAVAA-Windows
          path: navaa-desktop/dist/*
          if-no-files-found: error
