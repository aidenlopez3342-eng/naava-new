name: Build NAVAA Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'navaa-desktop/**'
      - 'NAVAA_calendar_updated.html'
      - '.github/workflows/desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
      
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy NAVAA interface
        run: node -e "require('fs').copyFileSync('NAVAA_calendar_updated.html', 'navaa-desktop/index.html')"

      - name: Copy NAVAA interface
        run: node -e "require('fs').copyFileSync('NAVAA_calendar_updated.html', 'navaa-desktop/index.html')"

      - name: Install dependencies
        working-directory: navaa-desktop
        run: npm install

      - name: Build Windows installer
        working-directory: navaa-desktop
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NAVAA-Windows
          path: navaa-desktop/dist/*
          if-no-files-found: error
