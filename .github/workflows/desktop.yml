name: Build Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['navaa-desktop/**']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: navaa-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: NAVAA-${{ matrix.os }}
          path: |
            navaa-desktop/dist/*.exe
            navaa-desktop/dist/*.zip
